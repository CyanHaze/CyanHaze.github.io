<svg xmlns="http://www.w3.org/2000/svg" width="360" height="405" viewBox="0 0 360 405" role="img" aria-labelledby="title desc">
<title id="title">DexJiT model</title><desc id="desc">Four observed frames condition a twelve-block JiT backbone. Twenty-eight future motion tokens produce fifty-six future frames.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#8492a9" stroke-width="1.2"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#355bea" stroke-width="1.2"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" fill="#25334a">
<rect x="20" y="20" width="140" height="52" rx="4" fill="#eef2ff" stroke="#d4defb"/><text x="90" y="42" text-anchor="middle" font-size="12" font-weight="600">Observed poses</text><text x="90" y="59" text-anchor="middle" font-size="10" fill="#718099">4 frames · 2 hands</text>
<path d="M161 46H191" fill="none" stroke="#8492a9" marker-end="url(#arrow)"/>
<rect x="200" y="20" width="140" height="52" rx="4" fill="#f7f9fe" stroke="#dce3ee"/><text x="270" y="42" text-anchor="middle" font-size="11" font-weight="600">Pose summary + time</text><text x="270" y="59" text-anchor="middle" font-size="10" fill="#718099">AdaLN in every block</text>
<path d="M270 73V91H350V227H341" fill="none" stroke="#355bea" stroke-width="1.2" marker-end="url(#blue)"/>
<path d="M90 73V91H10V277H19" fill="none" stroke="#8492a9" stroke-width="1.1" marker-end="url(#arrow)"/>
<rect x="20" y="117" width="140" height="52" rx="4" fill="#f4f6fa" stroke="#dce3ee"/><text x="90" y="139" text-anchor="middle" font-size="12" font-weight="600">Noisy future</text><text x="90" y="156" text-anchor="middle" font-size="10" fill="#718099">56 frames · 42 joints</text>
<path d="M161 143H191" fill="none" stroke="#8492a9" marker-end="url(#arrow)"/>
<rect x="200" y="117" width="140" height="52" rx="4" fill="#f4f7ff" stroke="#d2dcef"/><text x="270" y="139" text-anchor="middle" font-size="12" font-weight="600">28 motion tokens</text><text x="270" y="156" text-anchor="middle" font-size="10" fill="#718099">252 → 256 → 768</text>
<path d="M270 170V202" fill="none" stroke="#8492a9" marker-end="url(#arrow)"/>
<rect x="20" y="211" width="320" height="90" rx="5" fill="#1b3057"/><text x="180" y="232" text-anchor="middle" font-size="13" fill="white" font-weight="600">12 JiT blocks</text>
<g fill="#314c7b"><rect x="49" y="242" width="76" height="24" rx="3"/><rect x="142" y="242" width="76" height="24" rx="3"/><rect x="235" y="242" width="76" height="24" rx="3"/></g><g text-anchor="middle" font-size="11" fill="#e8eefb"><text x="87" y="258">1–4</text><text x="180" y="258">5–8</text><text x="273" y="258">9–12</text></g><text x="180" y="287" text-anchor="middle" font-size="10" fill="#bdcae0">8 observed tokens after block 4</text>
<path d="M180 302V329" fill="none" stroke="#8492a9" marker-end="url(#arrow)"/>
<rect x="110" y="338" width="140" height="52" rx="4" fill="#eef7f4" stroke="#c9e1d9"/><text x="180" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#326f62">56 frames</text><text x="180" y="377" text-anchor="middle" font-size="10" fill="#718099">Joint positions</text>
</g></svg>
