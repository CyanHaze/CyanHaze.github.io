<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
<title id="title">DexJiT 模型</title><desc id="desc">前四帧观测为十二层 JiT 主干提供条件，二十八个未来动作 token 生成后续五十六帧。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#8492a9" stroke-width="1.2" /></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#355bea" stroke-width="1.2" /></marker></defs>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#25334a">
<rect x="20" y="26" width="155" height="56" rx="5" fill="#eef2ff" stroke="#d4defb" /><text x="97" y="49" text-anchor="middle" font-size="13" font-weight="600">观测姿态</text><text x="97" y="68" text-anchor="middle" font-size="11" fill="#718099">4 帧 · 双手</text>
<path d="M176 54H210" stroke="#8492a9" fill="none" marker-end="url(#arrow)" />
<rect x="220" y="26" width="170" height="56" rx="5" fill="#f7f9fe" stroke="#dce3ee" /><text x="305" y="49" text-anchor="middle" font-size="12" font-weight="600">姿态摘要 + 时间</text><text x="305" y="68" text-anchor="middle" font-size="11" fill="#718099">逐层 AdaLN 条件注入</text>
<path d="M391 54H548V120" stroke="#355bea" stroke-width="1.3" fill="none" marker-end="url(#blue)" />
<path d="M192 54V104H463V120" stroke="#8492a9" stroke-width="1.1" fill="none" marker-end="url(#arrow)" /><rect x="219" y="93" width="216" height="21" fill="white" /><text x="327" y="107" text-anchor="middle" font-size="10" fill="#718099">第 4 层后加入 8 个观测 token</text>
<rect x="20" y="171" width="155" height="65" rx="5" fill="#f4f6fa" stroke="#dce3ee" /><text x="97" y="197" text-anchor="middle" font-size="13" font-weight="600">带噪未来动作</text><text x="97" y="218" text-anchor="middle" font-size="11" fill="#718099">56 帧 · 42 个关节</text>
<path d="M176 202H210" stroke="#8492a9" fill="none" marker-end="url(#arrow)" />
<rect x="220" y="171" width="170" height="65" rx="5" fill="#f4f7ff" stroke="#d2dcef" /><text x="305" y="196" text-anchor="middle" font-size="13" font-weight="600">28 个动作 token</text><text x="305" y="218" text-anchor="middle" font-size="11" fill="#718099">252 → 256 → 768</text>
<path d="M391 202H422" stroke="#8492a9" fill="none" marker-end="url(#arrow)" />
<rect x="433" y="132" width="224" height="116" rx="6" fill="#1b3057" /><text x="545" y="157" text-anchor="middle" font-size="14" fill="white" font-weight="600">12 层 JiT</text>
<g fill="#314c7b"><rect x="451" y="174" width="55" height="33" rx="3" /><rect x="517" y="174" width="55" height="33" rx="3" /><rect x="583" y="174" width="55" height="33" rx="3" /></g><g text-anchor="middle" font-size="12" fill="#e8eefb"><text x="478" y="196">1–4</text><text x="544" y="196">5–8</text><text x="610" y="196">9–12</text></g>
<text x="545" y="231" text-anchor="middle" font-size="11" fill="#bdcae0">宽度 768 · 12 个头</text>
<path d="M658 202H689" stroke="#8492a9" fill="none" marker-end="url(#arrow)" />
<rect x="700" y="171" width="120" height="65" rx="5" fill="#eef7f4" stroke="#c9e1d9" /><text x="760" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#326f62">56 帧</text><text x="760" y="218" text-anchor="middle" font-size="11" fill="#718099">关节位置</text>
</g></svg>